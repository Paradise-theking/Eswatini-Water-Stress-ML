name: Paper 2 drought event audit

on:
  push:
    branches:
      - research/drought-event-audit
    paths:
      - scripts/audit_drought_events.py
      - data/processed/expanded/mnjoli_water_stress_monthly_1981_2025_swba.csv
      - .github/workflows/paper2-drought-event-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependency
        run: python -m pip install pandas numpy
      - name: Run descriptive event audit
        run: python scripts/audit_drought_events.py
      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper2-drought-event-audit
          path: outputs/research/drought_event_audit/
          if-no-files-found: error
