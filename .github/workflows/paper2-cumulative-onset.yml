name: Paper 2 cumulative drought-onset forecasting
on:
  push:
    branches: [research/drought-event-audit]
    paths:
      - scripts/paper2_cumulative_onset.py
      - .github/workflows/paper2-cumulative-onset.yml
      - data/processed/expanded/mnjoli_water_stress_monthly_1981_2025_swba.csv
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cumulative-onset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pandas numpy scikit-learn
      - name: Run cumulative-onset experiment
        run: python scripts/paper2_cumulative_onset.py
      - name: Upload cumulative-onset results
        uses: actions/upload-artifact@v4
        with:
          name: paper2-cumulative-onset
          path: outputs/research/paper2_cumulative_onset/
          if-no-files-found: error
