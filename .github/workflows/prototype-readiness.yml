name: WaterWatch prototype readiness checks

on:
  push:
    branches:
      - feature/prototype-readiness-data-gates
  pull_request:
    branches:
      - main

jobs:
  data-quality-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend Python modules
        run: python -m compileall -q backend
      - name: Run data-quality gate tests
        run: python -m unittest discover -s tests -v
