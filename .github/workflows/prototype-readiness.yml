name: WaterWatch prototype readiness checks

on:
  workflow_dispatch:
  push:
    branches:
      - feature/prototype-readiness-data-gates
  pull_request:
    branches:
      - main

jobs:
  data-quality-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend Python modules
        run: python -m compileall -q backend scripts
      - name: Run data-quality gate tests
        run: python -m unittest discover -s tests -v
      - name: Compare true 1-, 2- and 3-month forecast leads
        run: python scripts/evaluate_true_lead_horizons.py
      - name: Upload horizon evaluation outputs
        uses: actions/upload-artifact@v4
        with:
          name: waterwatch-horizon-evaluation
          path: outputs/expanded/horizon_comparison/*.csv
          if-no-files-found: error

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check and build frontend
        working-directory: frontend
        run: npm run build
