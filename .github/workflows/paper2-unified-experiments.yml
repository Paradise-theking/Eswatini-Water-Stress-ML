name: Paper 2 unified experiments

on:
  push:
    branches:
      - research/drought-event-audit
    paths:
      - scripts/run_paper2_unified_experiments.py
      - scripts/paper2_event_forecasting.py
      - scripts/paper2_transition_forecasting.py
      - scripts/paper2_direction_forecasting.py
      - scripts/paper2_conditional_transition_matrix.py
      - data/processed/expanded/mnjoli_water_stress_monthly_1981_2025_swba.csv
      - .github/workflows/paper2-unified-experiments.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unified-experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pandas numpy scikit-learn
      - name: Execute all experiments
        run: python scripts/run_paper2_unified_experiments.py
      - name: Upload unified logs and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper2-unified-run
          path: outputs/research/paper2_unified_run/
          if-no-files-found: error
      - name: Upload experiment outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper2-experiment-results
          path: outputs/research/paper2_*/
          if-no-files-found: warn
