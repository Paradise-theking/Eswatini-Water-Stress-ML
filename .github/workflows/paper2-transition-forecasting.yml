name: Paper 2 multi-state transition forecasting

on:
  push:
    branches:
      - research/drought-event-audit
    paths:
      - scripts/paper2_transition_forecasting.py
      - data/processed/expanded/mnjoli_water_stress_monthly_1981_2025_swba.csv
      - .github/workflows/paper2-transition-forecasting.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transition-experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pandas numpy scikit-learn
      - name: Run multi-state forecast experiment
        run: python scripts/paper2_transition_forecasting.py
      - name: Upload experiment outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper2-transition-forecasting
          path: outputs/research/paper2_transition_forecasting/
          if-no-files-found: error
