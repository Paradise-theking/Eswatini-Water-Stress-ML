name: Paper 2 conditional transition matrix

on:
  push:
    branches:
      - research/drought-event-audit
    paths:
      - scripts/paper2_conditional_transition_matrix.py
      - data/processed/expanded/mnjoli_water_stress_monthly_1981_2025_swba.csv
      - .github/workflows/paper2-conditional-transition-matrix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transition-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install pandas numpy scikit-learn
      - name: Execute experiment
        run: python scripts/paper2_conditional_transition_matrix.py
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper2-conditional-transition-matrix
          path: outputs/research/paper2_conditional_transitions/
          if-no-files-found: error
